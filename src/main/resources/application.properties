spring.application.name=demo

# Keycloak issues tokens; this API only validates them.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/jwt-login}
# Explicit JWKS endpoint allows the API to start before Keycloak is available.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=jwt-login-api
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
