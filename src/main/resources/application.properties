spring.application.name=demo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jwtlogin;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.open-in-view=false
app.auth.username=${AUTH_USERNAME:admin}
app.auth.password=${AUTH_PASSWORD:password}
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ITCJWTRealm}