spring.application.name=demo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/appdb}
spring.datasource.username=${DATABASE_USERNAME:appuser}
spring.datasource.password=${DATABASE_PASSWORD:apppass}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ITCJWTRealm}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:ReactClient}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ITCJWTRealm}
app.frontend-url=${FRONTEND_ORIGIN:http://localhost:3000}
