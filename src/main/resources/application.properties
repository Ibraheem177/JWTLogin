spring.application.name=demo

# --- Database (in-memory H2, wiped on every restart) ---
spring.datasource.url=jdbc:h2:mem:jwtdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- JWT settings ---
# Base64-encoded secret (must be at least 256 bits) used to sign tokens (HMAC-SHA256).
# In a real project this comes from an environment variable, never from git.
app.jwt.secret=${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWtleS1mb3Itand0LWxvZ2luLWRlbW8tMzJieXRlcw==}
# How long a token stays valid, in milliseconds (1 hour)
app.jwt.expiration-ms=3600000

# Include the reason (e.g. "Invalid username or password") in error JSON so the UI can show it
server.error.include-message=always
