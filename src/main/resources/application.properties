spring.application.name=demo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/appdb}
spring.datasource.username=${DATABASE_USERNAME:appuser}
spring.datasource.password=${DATABASE_PASSWORD:apppass}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ITCJWTRealm}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:ReactClient}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
app.keycloak.redirect-uri=${KEYCLOAK_REDIRECT_URI:http://localhost:8081/api/keycloak}
