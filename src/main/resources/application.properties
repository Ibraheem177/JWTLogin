spring.application.name=demo
server.port=8080
spring.datasource.url=jdbc:h2:mem:jwtlogin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
